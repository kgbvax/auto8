name: build

# Builds the ready requirements of one plan to a pull request (U14 of the
# requirements-workflow plan, R10 to R14, R18 to R21, R27, R32).
#
# A schedule starts the build every four hours. The schedule acts only
# while the repository variable AUTO8_BUILD_ENABLED is true. A manual start
# always runs. GitHub turns off the schedule of a public repository after
# 60 days without activity in the repository.
#
# The build has three jobs, each on its own runner:
#
#   pick     full App token. reap sets blocked on stopped builds (R11).
#            pick sets building on the ready issues of the next plan.
#   build    Claude, with the read-only GITHUB_TOKEN of the job. The App
#            private key never comes to this runner, because the agent can
#            run go, and so it can run any code on its runner. Its result
#            leaves the runner only as an artifact: a git bundle and three
#            text files.
#
# The Go cache is off in all jobs. Code on the build runner can write to
# the Actions cache, and the jobs with the full App token must not restore
# what it wrote.
#   publish  full App token, no Claude, a new checkout of main. It applies
#            the decisions of the agent through auto8-flow, pushes the
#            branch, opens the pull request and runs holds (KTD15).
#
# If the build job fails or a run is cancelled, publish sets blocked on
# the picked issues with the reason (KTD7).

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print what reap and pick would change, and build nothing
        type: boolean
        default: false

permissions:
  contents: read

# One build at a time (R10, AE8). A second run waits until the first ends.
# GitHub keeps only one waiting run, so a third start replaces the waiting
# one. The next schedule picks up what is left.
concurrency:
  group: auto8-build
  cancel-in-progress: false

env:
  AUTO8_APP_LOGIN: ${{ vars.AUTO8_APP_LOGIN || 'opsotter-auto8[bot]' }}
  # The release compound-engineering-v3.33.2 (KTD16). Change it together
  # with the ref in .claude/settings.json.
  CE_MARKETPLACE_REPO: https://github.com/EveryInc/compound-engineering-plugin.git
  CE_MARKETPLACE_SHA: fbd794f329f5b65d0ea00a5e6487336c385ff2be

jobs:
  pick:
    if: >-
      inputs.dry_run ||
      (vars.AUTO8_APP_CLIENT_ID != '' &&
      (github.event_name == 'workflow_dispatch' || vars.AUTO8_BUILD_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      found: ${{ steps.pick.outputs.found }}
      pick: ${{ steps.pick.outputs.pick }}
      plan: ${{ steps.pick.outputs.plan }}
      ids: ${{ steps.pick.outputs.ids }}
      base: ${{ steps.pick.outputs.base }}
      branch: ${{ steps.pick.outputs.branch }}
      bot_id: ${{ steps.bot.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Get an App token
        id: app
        if: ${{ !inputs.dry_run }}
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.AUTO8_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTO8_APP_PRIVATE_KEY }}

      - name: Block stopped builds
        env:
          AUTO8_TOKEN: ${{ steps.app.outputs.token || github.token }}
          AUTO8_PROJECT_ID: ${{ vars.AUTO8_PROJECT_ID }}
          DRY_RUN: ${{ inputs.dry_run && '-dry-run' || '' }}
        run: go run ./cmd/auto8-flow reap $DRY_RUN

      - name: Pick the next plan
        id: pick
        env:
          AUTO8_TOKEN: ${{ steps.app.outputs.token || github.token }}
          AUTO8_PROJECT_ID: ${{ vars.AUTO8_PROJECT_ID }}
          DRY_RUN: ${{ inputs.dry_run && '-dry-run' || '' }}
          RUN_ID: ${{ github.run_id }}
        run: |
          go run ./cmd/auto8-flow pick $DRY_RUN > "$RUNNER_TEMP/pick.out"
          cat "$RUNNER_TEMP/pick.out"
          # pick prints its result as the last line. In a dry run, the
          # lines before it are the planned changes.
          tail -n 1 "$RUNNER_TEMP/pick.out" > "$RUNNER_TEMP/pick.json"
          plan=$(jq -r '.pick.plan // ""' "$RUNNER_TEMP/pick.json")
          if [ -z "$plan" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No valid ready issue. Nothing to build." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ids=$(jq -r '.pick.ids | join(",")' "$RUNNER_TEMP/pick.json")
          echo "Picked $plan: $ids" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$DRY_RUN" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "Dry run: no build." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          name=$(basename "$plan" .md | tr -c 'a-zA-Z0-9.-' '-' | cut -c1-60)
          {
            echo "found=true"
            echo "plan=$plan"
            echo "ids=$ids"
            echo "pick=$(jq -c . "$RUNNER_TEMP/pick.json")"
            echo "base=$(git rev-parse HEAD)"
            echo "branch=auto8/build-$RUN_ID-${name%-}"
          } >> "$GITHUB_OUTPUT"

      - name: Find the user ID of the App
        id: bot
        if: steps.pick.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          login=$(jq -rn --arg l "$AUTO8_APP_LOGIN" '$l | @uri')
          echo "id=$(gh api "/users/$login" --jq .id)" >> "$GITHUB_OUTPUT"

  build:
    needs: pick
    if: needs.pick.outputs.found == 'true'
    runs-on: ubuntu-latest
    # The first real builds set this value. Change it when builds need more.
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pick.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Prepare the branch and the prompt
        id: prompt
        env:
          PLAN: ${{ needs.pick.outputs.plan }}
          IDS: ${{ needs.pick.outputs.ids }}
          BASE: ${{ needs.pick.outputs.base }}
          BRANCH: ${{ needs.pick.outputs.branch }}
        run: |
          git switch -c "$BRANCH"
          mkdir .auto8-out
          echo '/.auto8-out/' >> .git/info/exclude
          {
            echo 'text<<AUTO8_PROMPT_END'
            cat .github/auto8/build-prompt.md
            echo
            echo "- Plan file: \`$PLAN\`"
            echo "- Requirements: ${IDS//,/, }"
            echo "- Start commit (main): \`$BASE\`"
            echo "- Branch: \`$BRANCH\`"
            echo 'AUTO8_PROMPT_END'
          } >> "$GITHUB_OUTPUT"

      # The plugin comes from a local copy at the pinned commit, so the
      # build cannot load another release (R28, KTD16).
      - name: Get the compound-engineering plugin at the pin
        run: |
          dir="$RUNNER_TEMP/ce-marketplace"
          git init -q "$dir"
          git -C "$dir" fetch -q --depth 1 "$CE_MARKETPLACE_REPO" "$CE_MARKETPLACE_SHA"
          git -C "$dir" checkout -q FETCH_HEAD
          echo "CE_MARKETPLACE_DIR=$dir" >> "$GITHUB_ENV"

      - name: Build with Claude
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The GITHUB_TOKEN of this job can only read the contents. The
          # App private key never comes to this runner.
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt.outputs.text }}
          plugin_marketplaces: ${{ env.CE_MARKETPLACE_DIR }}
          plugins: compound-engineering@compound-engineering-plugin
          bot_name: ${{ env.AUTO8_APP_LOGIN }}
          bot_id: ${{ needs.pick.outputs.bot_id }}
          # The logs of a public repository are public (R27).
          show_full_output: false
          display_report: false
          claude_args: >-
            --allowedTools "Read,Write,Edit,MultiEdit,Glob,Grep,Skill,Task,Agent,TodoWrite,Bash(go:*),Bash(gofmt:*),Bash(git:*),Bash(python3 tools/simple-english/ste_lint.py:*)"
            --disallowedTools "WebFetch,WebSearch"

      - name: Pack the result
        if: always()
        env:
          BASE: ${{ needs.pick.outputs.base }}
        run: |
          out="$RUNNER_TEMP/result"
          mkdir -p "$out"
          for f in pr-title.txt pr-body.md decisions.json; do
            if [ -f ".auto8-out/$f" ]; then
              cp ".auto8-out/$f" "$out/$f"
            fi
          done
          if [ "$(git rev-parse HEAD)" != "$BASE" ]; then
            git bundle create "$out/build.bundle" "$BASE..HEAD"
          fi
          ls -l "$out"

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-result
          path: ${{ runner.temp }}/result
          retention-days: 3
          if-no-files-found: warn

  publish:
    needs: [pick, build]
    if: always() && needs.pick.outputs.found == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # Each step has if: always(), so that the job also blocks the issues
    # after a cancelled run.
    steps:
      - if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pick.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - if: always()
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build auto8-flow from main
        if: always()
        run: go build -o "$RUNNER_TEMP/auto8-flow" ./cmd/auto8-flow

      - name: Get an App token
        id: app
        if: always()
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.AUTO8_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTO8_APP_PRIVATE_KEY }}

      - name: Download the result
        if: needs.build.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-result
          path: ${{ runner.temp }}/result

      - name: Publish the build
        if: always()
        env:
          FLOW: ${{ runner.temp }}/auto8-flow
          RESULT: ${{ runner.temp }}/result
          WORK: ${{ runner.temp }}/auto8
          PICK: ${{ needs.pick.outputs.pick }}
          BASE: ${{ needs.pick.outputs.base }}
          BRANCH: ${{ needs.pick.outputs.branch }}
          BUILD_RESULT: ${{ needs.build.result }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          AUTO8_TOKEN: ${{ steps.app.outputs.token }}
          AUTO8_PROJECT_ID: ${{ vars.AUTO8_PROJECT_ID }}
        run: bash .github/auto8/publish.sh

      - name: Block the build after a failure
        if: failure() || cancelled()
        env:
          FLOW: ${{ runner.temp }}/auto8-flow
          PLAN: ${{ needs.pick.outputs.plan }}
          IDS: ${{ needs.pick.outputs.ids }}
          AUTO8_TOKEN: ${{ steps.app.outputs.token }}
          AUTO8_PROJECT_ID: ${{ vars.AUTO8_PROJECT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for id in ${IDS//,/ }; do
            "$FLOW" mark -state blocked -plan "$PLAN" -ids "$id" \
              -reason "The publish step of the build failed. Read the log of $RUN_URL. Set ready to build it again." || true
          done
